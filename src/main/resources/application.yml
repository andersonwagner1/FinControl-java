spring:
  application:
    name: api-financa
  datasource:
    url: jdbc:postgresql://localhost:5432/Conta
    username: postgres
    password: Sata2811@
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

